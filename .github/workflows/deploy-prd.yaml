name: Deploy PRD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prd
  cancel-in-progress: false

env:
  DOCKER_TAGS: 21gifts/app:latest

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy to PRD
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Require the production Breez API key
        env:
          BREEZ_API_KEY_PRD: ${{ secrets.BREEZ_API_KEY_PRD }}
        run: |
          set -euo pipefail
          if [ -z "${BREEZ_API_KEY_PRD//[[:space:]]/}" ]; then
            echo "::error::BREEZ_API_KEY_PRD is empty — the production image needs it for the in-app wallet. Set the repository secret and re-run."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_TAGS }}
            21gifts/app:latest-${{ github.sha }}
          platforms: linux/arm64
          cache-from: type=registry,ref=21gifts/app:buildcache
          cache-to: type=registry,ref=21gifts/app:buildcache,mode=max
          build-args: |
            APP_VERSION=${{ github.run_number }}
            NEXT_PUBLIC_BREEZ_API_KEY=${{ secrets.BREEZ_API_KEY_PRD }}
            NEXT_PUBLIC_BUILD_ID=${{ github.sha }}

      - name: Notify infrastructure to pull :latest
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          DISPATCH_REPO: ${{ secrets.DISPATCH_REPO }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ] || [ -z "${DISPATCH_REPO}" ]; then
            echo "::error::DISPATCH_TOKEN or DISPATCH_REPO unset — cannot deploy this image"
            exit 1
          fi
          dispatched_at="$(date -u -d '5 seconds ago' +%Y-%m-%dT%H:%M:%SZ)"
          echo "DISPATCHED_AT=${dispatched_at}" >> "$GITHUB_ENV"
          gh api "repos/${DISPATCH_REPO}/dispatches" \
            -f event_type=image-published \
            -f "client_payload[image]=21gifts/app" \
            -f "client_payload[tag]=latest" \
            -f "client_payload[sha]=${GITHUB_SHA}"

      - name: Wait for infrastructure deploy
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          DISPATCH_REPO: ${{ secrets.DISPATCH_REPO }}
          IMAGE: 21gifts/app
          TAG: latest
        run: bash .github/scripts/wait-for-image-published.sh
