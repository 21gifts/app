name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, Lint, Handbook, E2E-check, Screenshots, Test (100% coverage), Build, E2E
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Same image that generated e2e/visual.spec.ts-snapshots (Linux Chromium).
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Handbook completeness
        run: npm run handbook:check

      - name: E2E completeness
        run: npm run e2e:check

      - name: Screenshot baselines
        run: npm run screenshot:check

      - name: Test with 100% coverage gate
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npm run e2e
        env:
          HOSTNAME: 0.0.0.0
