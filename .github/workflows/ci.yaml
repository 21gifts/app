name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      shop_edit_snapshots:
        description: Record the new shop-edit Linux baselines and upload them
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Each job must finish within 10 minutes; do not raise the timeout.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  check:
    name: Typecheck, Handbook, E2E-check, Screenshots, Test (100% coverage), Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Handbook completeness
        run: npm run handbook:check

      - name: E2E completeness
        run: npm run e2e:check

      - name: Screenshot baselines
        run: npm run screenshot:check

      - name: Test with 100% coverage gate
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    name: E2E (behavior, shard ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # One job per shard keeps each inside the 10 minutes. Add a shard when one
      # comes close: a new number in `shard` and the new total in `shards`.
      matrix:
        shard: [1, 2, 3]
        shards: [3]
    # Same image that generated e2e/visual.spec.ts-snapshots (Linux Chromium).
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: End-to-end tests (behavior, shard ${{ matrix.shard }}/${{ matrix.shards }})
        run: npm run e2e:behavior -- --shard=${{ matrix.shard }}/${{ matrix.shards }}
        env:
          HOSTNAME: 0.0.0.0

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output-behavior-${{ matrix.shard }}
          path: |
            test-results/
            e2e/visual.spec.ts-snapshots/

  # The required check. It is green only when every behavior shard is green.
  e2e-behavior:
    name: E2E (behavior)
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: All behavior shards passed
        env:
          SHARDS_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "Behavior shards: $SHARDS_RESULT"
          test "$SHARDS_RESULT" = "success"

  visual-shards:
    name: Visual (${{ matrix.project }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # One job per project and shard keeps each inside the 10 minutes. Add a
      # shard when one comes close: a new number in `shard` and the new total in
      # `shards`.
      matrix:
        project: [desktop-light, desktop-dark, mobile-light, mobile-dark]
        shard: [1, 2]
        shards: [2]
    # Same image that generated e2e/visual.spec.ts-snapshots (Linux Chromium).
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Visual regression (${{ matrix.project }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
        run: npm run e2e:visual -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }}
        env:
          HOSTNAME: 0.0.0.0

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            test-results/
            e2e/visual.spec.ts-snapshots/

  # The required checks Visual (<project>). Each is green only when every visual
  # shard is green.
  visual:
    name: Visual (${{ matrix.project }})
    needs: visual-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-light, desktop-dark, mobile-light, mobile-dark]
    steps:
      - name: All visual shards passed
        env:
          SHARDS_RESULT: ${{ needs.visual-shards.result }}
        run: |
          echo "Visual shards: $SHARDS_RESULT"
          test "$SHARDS_RESULT" = "success"

  # Only when a dispatch asks for the new shop-edit baselines. Pull requests
  # do not run these jobs. The ten-minute cap stays. The record step allows
  # missing handbook images so the build can start before those shots exist.
  shop-edit-snapshots:
    name: Shop-edit baselines (${{ matrix.project }})
    if: github.event_name == 'workflow_dispatch' && inputs.shop_edit_snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-light, desktop-dark, mobile-light, mobile-dark]
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Record shop-edit baselines (${{ matrix.project }})
        run: npx playwright test e2e/visual.spec.ts --project=${{ matrix.project }} --update-snapshots --grep "$SHOP_EDIT_GREP"
        env:
          HOSTNAME: 0.0.0.0
          HANDBOOK_IMAGES_ALLOW_MISSING: '1'
          SHOP_EDIT_GREP: >-
            shop-edit-saving|shop-edit-history-loading|shop-edit-place-map-loading|shop-edit-save-error|shop-edit-history-error|map-edit-saving|map-edit-history-loading|map-edit-place-map-loading|map-edit-save-error|map-edit-history-error|table-edit-saving|table-edit-history-loading|table-edit-place-map-loading|table-edit-save-error|table-edit-history-error|shops edit-saving|shops edit-history-loading|shops edit-place-map-loading|staff-place-map-loading

      - name: Collect changed baselines
        if: always()
        shell: bash
        run: |
          mkdir -p new-snaps
          git -c safe.directory='*' status --porcelain -- e2e/visual.spec.ts-snapshots | while IFS= read -r line; do
            file=${line:3}
            mkdir -p "new-snaps/$(dirname "$file")"
            cp "$file" "new-snaps/$file"
          done
          find new-snaps -type f | wc -l

      - name: Upload changed baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shop-edit-snapshots-${{ matrix.project }}
          path: new-snaps/
          if-no-files-found: warn
