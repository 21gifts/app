name: Handbook login images

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  capture:
    name: Capture login handbook PNGs
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Capture signed-in handbook variants
        run: npx playwright test e2e/handbook-capture.spec.ts -g "login signed-in"
        env:
          UPDATE_HANDBOOK_IMAGES: "1"
          HOSTNAME: 0.0.0.0
          CI: "true"

      - name: Upload handbook login images
        uses: actions/upload-artifact@v4
        with:
          name: handbook-login-images
          path: |
            docs/handbook/images/login-signed-in.png
            docs/handbook/images/login-signed-in-named.png
            docs/handbook/images/login-signed-in-linked.png
            public/handbook-images/login-signed-in.png
            public/handbook-images/login-signed-in-named.png
            public/handbook-images/login-signed-in-linked.png
